<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 7 — World Wide Web Quiz</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#17212b;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:22px 15px 45px}.header{background:#17365d;color:white;border-radius:16px;padding:25px;margin-bottom:16px}.header h1{margin:0 0 8px;font-size:27px}.card,.result{background:white;border-radius:13px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #0001}.row{display:flex;justify-content:space-between;gap:10px;font-weight:bold;margin-bottom:10px}.bar{height:9px;background:#e2e8ef;border-radius:20px;overflow:hidden}.fill{height:100%;background:#2f75b5;width:0;transition:.25s}.q{font-size:20px;line-height:1.45;font-weight:bold;margin:15px 0}.option{display:block;border:2px solid #d7dfe7;border-radius:10px;padding:13px;margin:10px 0;cursor:pointer;line-height:1.4}.option:hover{background:#f7fbff}.option input{margin-right:8px}.option.correct{border-color:#238343;background:#eaf7ee}.option.wrong{border-color:#c62828;background:#fff0f0}button{border:0;border-radius:9px;padding:12px 18px;margin:10px 8px 0 0;font-weight:bold;font-size:15px;cursor:pointer}.primary{background:#17365d;color:white}.secondary{background:#e8edf2;color:#17365d}button:disabled{opacity:.45;cursor:not-allowed}.result{display:none}.score{font-size:38px;font-weight:800;color:#17365d}.review{margin-top:20px;text-align:left}.review-item{padding:14px 0;border-top:1px solid #e1e6eb;line-height:1.5}.right{color:#1b6b32}.incorrect{color:#9b2c2c}@media(max-width:600px){.header h1{font-size:22px}.q{font-size:18px}.wrap{padding:12px}}</style></head><body><div class="wrap">
<header class="header"><h1>Year 7 — The World Wide Web</h1><p>15-question knowledge check · Choose one answer for each question.</p></header>
<div class="card"><div class="row"><span id="progress">Question 1 of 15</span><span id="score">Score: 0</span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div id="quiz"></div>
<section class="result card" id="result"><h2>Quiz Complete!</h2><div class="score" id="final"></div><p id="message"></p><button class="primary" onclick="restart()">Try Again</button><div class="review" id="review"></div></section></div>
<script>const questions=[{"q": "What is a web browser used for?", "options": ["To store every website on the internet", "To encrypt all files on a computer", "To view information on the World Wide Web", "To assign IP addresses to computers"], "answer": 2, "explanation": "A browser retrieves website code and displays the page for the user."}, {"q": "What does a web browser retrieve from a web server?", "options": ["The computer's operating system", "The website's code and page information", "A user's search history", "Only the website's domain name"], "answer": 1, "explanation": "The browser retrieves the website code from the web server."}, {"q": "What is a web server?", "options": ["A server on the internet that stores website pages", "A type of URL", "A software used only to search keywords", "A device that displays webpages to a user"], "answer": 0, "explanation": "A web server holds website web pages and sends information to browsers."}, {"q": "What does HTTP stand for?", "options": ["High Transfer Text Program", "Hyperlink Text Processing", "Hypertext Transfer Protocol", "Hypertext Transmission Page"], "answer": 2, "explanation": "HTTP means Hypertext Transfer Protocol."}, {"q": "Which statement about HTTP is correct?", "options": ["It is only used for search engines", "It is the same as a domain name", "Messages are readable by other devices and it is not secure", "It always encrypts messages"], "answer": 2, "explanation": "HTTP does not encrypt messages, so they may be readable by other devices."}, {"q": "What does HTTPS stand for?", "options": ["High-level Text Transfer Secure", "Hyperlink Transfer Page Secure", "Hypertext Transfer Protocol Secure", "Hypertext Transfer Protocol System"], "answer": 2, "explanation": "HTTPS means Hypertext Transfer Protocol Secure."}, {"q": "Why is HTTPS considered secure?", "options": ["It prevents a website from having a domain name", "It stores webpages only on the user's computer", "It encrypts messages sent between the browser and website", "It changes the website into a search engine"], "answer": 2, "explanation": "HTTPS encrypts messages so other devices cannot understand their contents."}, {"q": "What is a web page?", "options": ["A document accessible over the internet using a browser", "A physical computer connected to a network", "A list of IP addresses", "A program that searches the web"], "answer": 0, "explanation": "A web page is a document that can be accessed on the internet through a browser."}, {"q": "Which language is usually used to write web pages in the lesson?", "options": ["SQL", "Python", "CSS only", "HTML"], "answer": 3, "explanation": "The lesson describes webpages as usually written in HTML."}, {"q": "What is a search engine?", "options": ["A computer that hosts all websites", "A protocol for encrypting messages", "A browser that can only display videos", "A website that lets users look up information on the World Wide Web"], "answer": 3, "explanation": "Search engines use keywords to find matches and display results. Google and Bing are examples."}, {"q": "What does URL stand for?", "options": ["United Resource Language", "Universal Web Link", "Uniform Routing Link", "Uniform Resource Locator"], "answer": 3, "explanation": "URL stands for Uniform Resource Locator, also called a web address."}, {"q": "In www.facebook.com, what is facebook.com called?", "options": ["The HTML code", "The World Wide Web part", "The domain name", "The protocol"], "answer": 2, "explanation": "facebook.com is the domain name in this web address."}, {"q": "What does the 'www' part of a web address indicate in the lesson example?", "options": ["The top-level domain", "That it is a website on the World Wide Web", "The country where the server is located", "That the connection is encrypted"], "answer": 1, "explanation": "The lesson says the 'www' part tells us it is a website."}, {"q": "What does DNS do?", "options": ["Encrypts HTTP messages", "Converts HTML into images", "Creates search keywords", "Maps domain names to IP addresses"], "answer": 3, "explanation": "DNS maps domain names to IP addresses and is described as the internet's phone book."}, {"q": "What does the top-level domain .gov usually indicate?", "options": ["A commercial website", "A non-profit organisation", "A government-based website", "An educational website"], "answer": 2, "explanation": ".gov is government-based and used to inform and provide public services."}];let index=0,score=0,answers=[];
function render(){let q=questions[index];document.getElementById('progress').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('fill').style.width=((index+1)/questions.length*100)+'%';document.getElementById('quiz').innerHTML=`<div class="card"><div class="q">${q.q}</div>${q.options.map((o,n)=>`<label class="option" id="opt${n}"><input type="radio" name="answer" value="${n}"><b>${String.fromCharCode(65+n)}.</b> ${o}</label>`).join('')}<button class="primary" id="check" onclick="checkAnswer()">Check Answer</button><button class="secondary" id="next" onclick="nextQuestion()" disabled>${index===questions.length-1?'See Results':'Next Question'}</button><p id="feedback"></p></div>`}
function checkAnswer(){let chosen=document.querySelector('input[name="answer"]:checked');if(!chosen){alert('Please select an answer.');return}let a=+chosen.value,q=questions[index],correct=a===q.answer;answers.push({chosen:a,correct});if(correct)score++;document.getElementById('score').textContent=`Score: ${score}`;q.options.forEach((o,n)=>{let el=document.getElementById('opt'+n);el.querySelector('input').disabled=true;if(n===q.answer)el.classList.add('correct');if(n===a&&!correct)el.classList.add('wrong')});let fb=document.getElementById('feedback');fb.innerHTML=correct?'<b class="right">Correct!</b> '+q.explanation:'<b class="incorrect">Not quite.</b> Correct answer: <b>'+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]+'</b><br>'+q.explanation;document.getElementById('check').disabled=true;document.getElementById('next').disabled=false}
function nextQuestion(){if(index<questions.length-1){index++;render()}else showResults()}
function showResults(){document.getElementById('quiz').style.display='none';let r=document.getElementById('result');r.style.display='block';document.getElementById('final').textContent=`${score} / ${questions.length} (${Math.round(score/questions.length*100)}%)`;document.getElementById('message').textContent=`Correct answers: ${score} · Incorrect answers: ${questions.length-score}. Review below.`;document.getElementById('review').innerHTML=questions.map((q,i)=>{let a=answers[i];return `<div class="review-item"><b>Q${i+1}. ${q.q}</b><br>${a.correct?'<span class="right">Your answer: '+String.fromCharCode(65+a.chosen)+'. '+q.options[a.chosen]+' — Correct</span>':'<span class="incorrect">Your answer: '+String.fromCharCode(65+a.chosen)+'. '+q.options[a.chosen]+' — Incorrect</span>'}<br><b>Correct answer: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b><br>${q.explanation}</div>`}).join('')}
function restart(){index=0;score=0;answers=[];document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render()}render();</script></body></html>
