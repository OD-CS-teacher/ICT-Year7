<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 7 – Wired and Wireless Networks Quiz</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#17233b;--muted:#5c6880;--accent:#3568d4;--good:#16834a;--bad:#c53a3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.5}
main{max-width:850px;margin:28px auto;padding:0 16px}.hero{background:#172b4d;color:#fff;padding:24px;border-radius:18px;margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:clamp(1.45rem,4vw,2rem)}.hero p{margin:0;color:#dce6f7}
.card{background:var(--card);padding:22px;border-radius:16px;box-shadow:0 5px 20px #192b4b12;margin:16px 0}
.topline{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-weight:bold;font-size:.95rem}
.progress{height:8px;background:#e4eaf4;border-radius:20px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;background:var(--accent);width:0%;transition:width .2s}
h2{font-size:1.25rem;margin:0 0 18px}.answers{display:grid;gap:10px}
.answer{border:2px solid #dbe3ef;background:#fff;border-radius:12px;padding:13px 15px;text-align:left;font-size:1rem;color:var(--ink);cursor:pointer}
.answer:hover{border-color:var(--accent);background:#f5f8ff}.answer:focus{outline:3px solid #9cbaff}
.answer.selected{border-color:var(--accent);background:#eaf1ff}.answer:disabled{cursor:default}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
button.primary,button.secondary{border:0;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:bold;cursor:pointer}
.primary{background:var(--accent);color:#fff}.secondary{background:#e6ebf4;color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none}.score{font-size:2.2rem;font-weight:bold}.review-item{border-left:5px solid #ccd5e4;padding:14px 16px;margin:12px 0;background:#f8faff;border-radius:8px}
.review-item.correct{border-color:var(--good)}.review-item.incorrect{border-color:var(--bad)}
.review-item h3{margin:0 0 8px;font-size:1rem}.tag{font-weight:bold}.good{color:var(--good)}.bad{color:var(--bad)}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin:22px}
@media(max-width:520px){.card{padding:16px}.actions button{flex:1}.topline{font-size:.85rem}}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>Year 7 – Wired and Wireless Networks</h1>
<p>Interactive quiz · 24 questions · Choose one answer for each question</p>
</section>
<section id="quiz" class="card">
<div class="topline"><span id="counter">Question 1 of 24</span><span id="progressText">0% complete</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<h2 id="question"></h2>
<div id="answers" class="answers"></div>
<div class="actions"><button class="secondary" id="back" disabled>Previous</button><button class="primary" id="next" disabled>Next</button></div>
</section>
<section id="result" class="card hidden"></section>
<footer>Based on the lesson presentation: “Wired and wireless networks”.</footer>
</main>
<script>
const data = [{"q": "How does a wired network send data?", "options": ["Along cables", "Using infrared light only", "Using satellite signals only", "Through radio waves in the air"], "answer": "Along cables", "ex": "The presentation defines wired networks as sending data along cables."}, {"q": "How does a wireless network send data?", "options": ["By moving data on USB drives", "Through the air using radio waves", "Only through Ethernet cables", "Through printed signals"], "answer": "Through the air using radio waves", "ex": "Wireless networks send data through the air using radio waves."}, {"q": "Which is an example of a wireless technology named in the lesson?", "options": ["Desktop PC", "Bluetooth", "Ethernet cable", "A printer cable"], "answer": "Bluetooth", "ex": "The lesson lists Bluetooth, WiFi, 3G and 4G as popular wireless technologies."}, {"q": "What is Bluetooth commonly used for in the lesson's example?", "options": ["Sending data through a long Ethernet cable", "Connecting a desktop PC to a wired network", "Measuring bandwidth", "Pairing headphones with a mobile phone to listen to music"], "answer": "Pairing headphones with a mobile phone to listen to music", "ex": "Bluetooth can transfer data over short distances, such as pairing headphones with a phone."}, {"q": "What does WiFi allow devices to do?", "options": ["Only connect using cables", "Increase the speed at which data travels automatically", "Convert bits into water", "Connect to the internet or communicate without wires"], "answer": "Connect to the internet or communicate without wires", "ex": "WiFi lets computers, smartphones and other networkable devices connect or communicate without wires."}, {"q": "What is bandwidth?", "options": ["The amount of data that can be moved from one point to another in a given time", "The number of computers in a network", "The physical length of a network cable", "The time needed to switch a device on"], "answer": "The amount of data that can be moved from one point to another in a given time", "ex": "The lesson defines bandwidth as the amount of data moved between points in a given time."}, {"q": "Does higher bandwidth necessarily make data travel faster?", "options": ["No; it allows more data to travel in a given time, but does not itself increase data travel speed", "Only when using a tablet", "Yes, because cables become shorter", "Yes, always"], "answer": "No; it allows more data to travel in a given time, but does not itself increase data travel speed", "ex": "The presentation emphasizes: more bandwidth does not increase the speed; it means more data can pass at a given time."}, {"q": "Which cable in the presentation's A, B, C comparison has the greatest bandwidth?", "options": ["Cable B", "They all have equal bandwidth", "Cable C", "Cable A"], "answer": "Cable A", "ex": "The answer slide identifies A as having the greatest bandwidth because it has the largest internal diameter."}, {"q": "Bandwidth is measured in which unit?", "options": ["Pixels per second", "Metres per second", "Bytes per metre", "Bits per second"], "answer": "Bits per second", "ex": "The lesson says bandwidth is measured in bits per second, commonly Mbps."}, {"q": "What does 1 Mb mean in the presentation?", "options": ["1 million bits", "1 thousand bits", "1 billion bits", "1 million bytes"], "answer": "1 million bits", "ex": "The presentation states that 1 Mb = 1 million bits."}, {"q": "Which typical download speed is listed for 3G?", "options": ["20 Mbps", "46 Mbps", "3 Mbps", "10 Gbps"], "answer": "3 Mbps", "ex": "The comparison slide lists 3G: 3 Mbps, 4G: 20 Mbps, broadband: 46 Mbps."}, {"q": "According to the presentation, which has the highest typical download speed among 3G, 4G and broadband?", "options": ["Broadband", "4G", "They are the same", "3G"], "answer": "Broadband", "ex": "The listed typical speeds are 3 Mbps for 3G, 20 Mbps for 4G and 46 Mbps for broadband."}, {"q": "What is downloading?", "options": ["Measuring a router's size", "Connecting a device with a cable", "Receiving data on your computer, such as browsing a web page or watching a video", "Sending data from your computer to the internet"], "answer": "Receiving data on your computer, such as browsing a web page or watching a video", "ex": "The lesson describes download as your computer receiving data."}, {"q": "Why are upload speeds usually much slower than download speeds, according to the lesson?", "options": ["ISPs allocate more available bandwidth to downloading because most users download more than they upload", "A bit cannot be uploaded", "All cables prevent uploading", "Uploading always uses radio waves"], "answer": "ISPs allocate more available bandwidth to downloading because most users download more than they upload", "ex": "The lesson says ISPs configure connections around popular activities, allocating more bandwidth to downloads."}, {"q": "What does buffering indicate in the lesson?", "options": ["Data is arriving more slowly than it is being processed, so more bandwidth may be needed", "The network has no users", "The device is connected with a wire", "Data is arriving faster than it is processed"], "answer": "Data is arriving more slowly than it is being processed, so more bandwidth may be needed", "ex": "Buffering can occur when incoming data cannot keep up, such as a paused film waiting to load."}, {"q": "Which pair is classified as light internet use?", "options": ["Checking social media and emailing regularly", "Online gaming and uploading videos daily", "Reading online news and checking the weather", "Uploading videos and watching HD films"], "answer": "Reading online news and checking the weather", "ex": "The lesson classifies reading online news and checking the weather as light internet use."}, {"q": "Which activity pair is classified as high internet use?", "options": ["Browsing a simple text page", "Online gaming and a vlogger uploading videos to YouTube daily", "Emailing regularly and checking social media", "Checking the weather and reading news"], "answer": "Online gaming and a vlogger uploading videos to YouTube daily", "ex": "The lesson places online gaming and daily video uploads in the high-use category."}, {"q": "Which is an advantage of a wired network?", "options": ["Portability", "Wireless signals cannot be intercepted", "Higher bandwidth and a faster connection with little to no interference", "No cables are needed"], "answer": "Higher bandwidth and a faster connection with little to no interference", "ex": "Wired network advantages listed include faster connection, higher bandwidth and better security."}, {"q": "Which is a disadvantage of a wired network?", "options": ["It is quick and cheap to add devices", "Cables can be a trip hazard and look unpleasant", "No trailing wires", "Devices can be moved freely"], "answer": "Cables can be a trip hazard and look unpleasant", "ex": "The presentation lists cables as a possible trip hazard and visually unpleasant."}, {"q": "Which is an advantage of a wireless network?", "options": ["Allows portability and avoids trailing wires", "Signals are never weakened by walls", "Higher bandwidth than wired networks", "Better security than wired networks"], "answer": "Allows portability and avoids trailing wires", "ex": "Wireless advantages include portability, no trailing wires, and quick/cheap connection of devices."}, {"q": "Which is a disadvantage of wireless networks?", "options": ["Wireless connections can be weakened by walls and ceilings", "Every device needs its own cable", "Devices must be fixed in position", "Wireless networks have no interference"], "answer": "Wireless connections can be intercepted more easily and may have lower bandwidth", "ex": "The lesson identifies lower bandwidth, interference/walls weakening signals, and less security as wireless disadvantages."}, {"q": "Which scenario does the lesson recommend for a wireless network?", "options": ["A primary school with computers fixed to desks", "A vlogger uploading videos requiring greater bandwidth", "An office where workers use fixed computers", "A cafe where customers bring portable devices"], "answer": "A cafe where customers bring portable devices", "ex": "The cafe scenario is recommended as wireless because customers' devices are portable and easier to connect wirelessly."}, {"q": "Which scenario does the lesson recommend for a wired network?", "options": ["Restaurant staff using portable tablets", "Family members moving around the house with portable devices", "A cafe with customers' own devices", "A vlogger uploading videos and online gaming"], "answer": "A vlogger uploading videos and online gaming", "ex": "The lesson recommends wired for the vlogger because uploads and online gaming require greater bandwidth."}, {"q": "What is the potential speed of 5G mentioned in the presentation?", "options": ["20 Mbps", "3 Mbps", "46 Mbps", "10 Gbps"], "answer": "10 Gbps", "ex": "The presentation says 5G has the potential to reach 10 Gbps, with 1 Gb = 1000 Mb."}];
let index=0, selections=Array(data.length).fill(null);
const $=id=>document.getElementById(id);
function render(){
 const q=data[index]; $('counter').textContent=`Question ${index+1} of ${data.length}`;
 const pct=Math.round(index/data.length*100); $('progressText').textContent=`${pct}% complete`; $('bar').style.width=pct+'%';
 $('question').textContent=q.q; $('answers').innerHTML='';
 q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer'+(selections[index]===opt?' selected':'');b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>{selections[index]=opt;render()};$('answers').appendChild(b)});
 $('back').disabled=index===0; $('next').disabled=selections[index]===null;
 $('next').textContent=index===data.length-1?'Finish quiz':'Next';
}
$('back').onclick=()=>{if(index>0){index--;render()}};
$('next').onclick=()=>{if(selections[index]===null)return;if(index<data.length-1){index++;render()}else finish()};
function finish(){
 $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
 let correct=0;data.forEach((q,i)=>{if(selections[i]===q.answer)correct++});
 const pct=Math.round(correct/data.length*100);
 $('result').innerHTML=`<h2>Quiz results</h2><div class="score">${correct} / ${data.length}</div><p><strong>${pct}%</strong> · Correct: <span class="good">${correct}</span> · Incorrect: <span class="bad">${data.length-correct}</span></p><p>Review your answers below.</p><div id="review"></div><button class="primary" id="restart">Try again</button>`;
 data.forEach((q,i)=>{const ok=selections[i]===q.answer;const item=document.createElement('div');item.className='review-item '+(ok?'correct':'incorrect');item.innerHTML=`<h3>${i+1}. ${q.q}</h3><p class="tag ${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}</p><p><strong>Your answer:</strong> ${escapeHtml(selections[i]||'Not answered')}</p><p><strong>Correct answer:</strong> ${escapeHtml(q.answer)}</p><p><strong>Explanation:</strong> ${escapeHtml(q.ex)}</p>`;$('review').appendChild(item)});
 $('restart').onclick=()=>{index=0;selections=Array(data.length).fill(null);$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})};
 window.scrollTo({top:0,behavior:'smooth'});
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script>
</body></html>
