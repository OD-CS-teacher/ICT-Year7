<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 7 Internet Interactive Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fb;color:#17233b;font-family:Arial,sans-serif;line-height:1.5}main{max-width:850px;margin:28px auto;padding:0 15px}.hero{background:#18345c;color:#fff;padding:24px;border-radius:17px;margin-bottom:17px}.hero h1{margin:0 0 7px;font-size:clamp(1.4rem,4vw,2rem)}.hero p{margin:0;color:#dce8fa}.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #192b4b12}.top{display:flex;justify-content:space-between;gap:10px;color:#5c6880;font-weight:bold}.progress{height:8px;background:#e5ebf4;border-radius:12px;margin:12px 0 20px;overflow:hidden}.bar{height:100%;background:#3568d4;width:0;transition:width .2s}h2{font-size:1.2rem;margin:0 0 18px}.answers{display:grid;gap:10px}.answer{background:#fff;border:2px solid #dbe3ef;border-radius:11px;padding:13px;text-align:left;font-size:1rem;cursor:pointer;color:#17233b}.answer:hover{border-color:#3568d4;background:#f5f8ff}.answer.selected{border-color:#3568d4;background:#eaf1ff}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px}button.primary,button.secondary{border:0;border-radius:10px;padding:12px 18px;font-weight:bold;font-size:1rem;cursor:pointer}.primary{background:#3568d4;color:white}.secondary{background:#e6ebf4;color:#17233b}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none}.score{font-size:2.3rem;font-weight:bold}.review{border-left:5px solid #cbd5e3;padding:13px 15px;margin:12px 0;background:#f8faff;border-radius:8px}.review.correct{border-color:#16834a}.review.incorrect{border-color:#c53a3a}.good{color:#16834a;font-weight:bold}.bad{color:#c53a3a;font-weight:bold}footer{text-align:center;color:#5c6880;font-size:.85rem;margin:22px}@media(max-width:520px){.card{padding:16px}.actions button{flex:1}}
</style></head><body><main><section class="hero"><h1>Year 7 – The Internet</h1><p>Interactive quiz · 24 questions · Select one answer per question</p></section>
<section id="quiz" class="card"><div class="top"><span id="counter">Question 1 of 24</span><span id="pct">0% complete</span></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="question"></h2><div id="answers" class="answers"></div><div class="actions"><button id="prev" class="secondary" disabled>Previous</button><button id="next" class="primary" disabled>Next</button></div></section>
<section id="result" class="card hidden"></section><footer>Quiz based on the uploaded Lesson 4 presentation: “The internet”.</footer></main>
<script>
const qs=[{"q": "What is the internet?", "opts": ["A worldwide network of computers", "A set of rules only", "A local printer connection", "A single computer"], "a": "A worldwide network of computers", "ex": "The lesson defines the internet as a worldwide network of computers."}, {"q": "What physical equipment is part of the internet?", "opts": ["Cables and routers", "Printed documents", "Only software applications", "Only mobile phones"], "a": "Cables and routers", "ex": "The internet includes physical hardware such as cables, routers and other hardware connecting devices."}, {"q": "Which is an example of a use of the internet?", "opts": ["Cloud storage", "Writing on paper only", "Turning on a light switch", "Using a calculator without a network"], "a": "Cloud storage", "ex": "Common internet uses include cloud storage, entertainment, communication, games, shopping and websites."}, {"q": "How does most internet data pass between continents, according to the presentation?", "opts": ["By radio from every home", "Only through satellites", "Using Bluetooth", "Through ocean-floor cables"], "a": "Through ocean-floor cables", "ex": "The presentation states that 99% of internet data passing across continents travels through seabed cables."}, {"q": "What percentage of internet data passing across continents is said to travel through seabed cables?", "opts": ["50%", "99%", "100%", "75%"], "a": "99%", "ex": "The lesson's stated figure is 99%."}, {"q": "What is the length of the Amitie cable stated in the presentation?", "opts": ["185 km", "6,792 km", "679 km", "39,000 km"], "a": "6,792 km", "ex": "The presentation gives Amitie's length as 6,792 km."}, {"q": "Which can damage oceanic cables?", "opts": ["Only rain", "Computer keyboards", "Anchors and fishing nets", "WiFi passwords"], "a": "Anchors and fishing nets", "ex": "The lesson notes anchors, trawling fishing nets and even shark bites as potential causes of cable damage."}, {"q": "What is a packet?", "opts": ["A complete internet cable", "A type of router", "A user password", "A small unit of data sent across a network"], "a": "A small unit of data sent across a network", "ex": "Networks send and receive messages in small units of data called packets."}, {"q": "Why might one message be split into multiple packets?", "opts": ["The receiver cannot have an IP address", "It may be too large to fit in one packet", "Routers only send images", "Every message must contain exactly four words"], "a": "It may be too large to fit in one packet", "ex": "A message can be too large for one packet, so it is divided into many packets."}, {"q": "What information is included in a packet's header, as described in the lesson?", "opts": ["Sender IP, receiver IP and sequence information", "Only the message text", "The screen size of the sender", "Only the receiver's name"], "a": "Sender IP, receiver IP and sequence information", "ex": "The header includes sender and receiver IP addresses plus the total packet count and sequence number."}, {"q": "What does the packet payload contain?", "opts": ["The sender's home address only", "The sequence number only", "The router's password", "The part of the message being sent"], "a": "The part of the message being sent", "ex": "The payload contains the data—the message part carried by the packet."}, {"q": "What is an IP address used for?", "opts": ["Encrypting every message automatically", "Uniquely identifying a device on the internet", "Measuring bandwidth", "Splitting cables"], "a": "Uniquely identifying a device on the internet", "ex": "The lesson says each internet device has an IP address that uniquely identifies it."}, {"q": "How is an IPv4-style address shown in this lesson structured?", "opts": ["Four numbers from 0 to 100 separated by dots", "Three numbers from 0 to 255 separated by dots", "Four numbers from 0 to 255 separated by dots", "Four numbers separated by dashes"], "a": "Four numbers from 0 to 255 separated by dots", "ex": "The presentation describes four groups, each between 0 and 255, separated by full stops."}, {"q": "Which is a valid example format of an IP address from the presentation?", "opts": ["192.168.5", "192-168-5-43", "300.168.5.43", "192.168.5.43"], "a": "192.168.5.43", "ex": "The presentation gives 192.168.5.43 as an example."}, {"q": "What does a router do across the internet?", "opts": ["Creates the message content", "Joins networks and forwards packets from sender to receiver", "Changes every IP address into a name", "Stores all websites permanently"], "a": "Joins networks and forwards packets from sender to receiver", "ex": "A router joins networks and forwards packets toward their destination."}, {"q": "Do all packets of one message necessarily take the same route?", "opts": ["Yes, always", "No, packets can take different routes", "They never use routers", "Only if the message is short"], "a": "No, packets can take different routes", "ex": "The presentation explains that packets may travel along different routes across the internet."}, {"q": "In the router diagram, which internet routers do all packets pass through?", "opts": ["IR2 and IR5", "IR1 and IR4", "IR6 and IR7", "IR3 and IR7"], "a": "IR1 and IR4", "ex": "The lesson answer states all packets pass through internet routers 1 and 4."}, {"q": "Can packets arrive at the destination in the wrong order?", "opts": ["No, packets cannot be delayed", "No, because routers guarantee arrival order", "Only when IP addresses are missing", "Yes, because they may travel along routes with different speeds or lengths"], "a": "Yes, because they may travel along routes with different speeds or lengths", "ex": "Packets can arrive out of order because their routes may differ."}, {"q": "If the packets arrive as Packet 1, Packet 3, Packet 4, Packet 2, what message order results for “hello / how / are / you?”?", "opts": ["how hello are you?", "hello you? how are", "hello how are you?", "hello are you? how"], "a": "hello are you? how", "ex": "The presentation gives this arrival order and resulting text as “hello are you? how”."}, {"q": "How does the receiving computer reassemble packets correctly?", "opts": ["By guessing the order", "Using the size of the monitor", "Using the sender's username", "Using the sequence number in the header"], "a": "Using the sequence number in the header", "ex": "The receiver waits for all packets and reassembles them in order using sequence numbers."}, {"q": "What does TCP stand for?", "opts": ["Transport Computer Path", "Transfer Cable Program", "Transmission Control Protocol", "Terminal Connection Process"], "a": "Transmission Control Protocol", "ex": "TCP stands for Transmission Control Protocol."}, {"q": "What is TCP's role in the lesson?", "opts": ["Routes packets based on IP addresses only", "Splits messages into packets and assembles them in correct order at the receiver", "Connects only wireless devices", "Assigns every computer a monitor"], "a": "Splits messages into packets and assembles them in correct order at the receiver", "ex": "The presentation attributes packet splitting and correct-order assembly to TCP."}, {"q": "What is IP's role in the lesson?", "opts": ["Routes packets; IP addresses uniquely identify devices", "Ensures every packet follows the same route", "Stores the payload in the cloud", "Splits a message into words"], "a": "Routes packets; IP addresses uniquely identify devices", "ex": "IP is described as the protocol for routing packets and addressing devices."}, {"q": "Which protocol splits messages into smaller pieces called packets?", "opts": ["FTP", "HTTP", "IP", "TCP"], "a": "TCP", "ex": "The lesson's plenary answer is TCP."}];let at=0,chosen=Array(qs.length).fill(null);const el=id=>document.getElementById(id);
function draw(){let q=qs[at];el('counter').textContent=`Question ${at+1} of ${qs.length}`;let p=Math.round(at/qs.length*100);el('pct').textContent=p+'% complete';el('bar').style.width=p+'%';el('question').textContent=q.q;el('answers').innerHTML='';q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='answer'+(chosen[at]===o?' selected':'');b.textContent='ABCD'[i]+'. '+o;b.onclick=()=>{chosen[at]=o;draw()};el('answers').appendChild(b)});el('prev').disabled=at===0;el('next').disabled=chosen[at]===null;el('next').textContent=at===qs.length-1?'Finish quiz':'Next'}
el('prev').onclick=()=>{if(at>0){at--;draw()}};el('next').onclick=()=>{if(chosen[at]===null)return;if(at<qs.length-1){at++;draw()}else showResult()};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showResult(){let score=qs.reduce((n,q,i)=>n+(chosen[i]===q.a?1:0),0);el('quiz').classList.add('hidden');el('result').classList.remove('hidden');el('result').innerHTML=`<h2>Your results</h2><div class="score">${score} / ${qs.length}</div><p><b>${Math.round(score/qs.length*100)}%</b> · Correct: <span class="good">${score}</span> · Incorrect: <span class="bad">${qs.length-score}</span></p><p>Answer review:</p><div id="reviews"></div><button class="primary" id="again">Try again</button>`;qs.forEach((q,i)=>{let ok=chosen[i]===q.a;let d=document.createElement('div');d.className='review '+(ok?'correct':'incorrect');d.innerHTML=`<b>${i+1}. ${esc(q.q)}</b><p class="${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}</p><p><b>Your answer:</b> ${esc(chosen[i]||'Not answered')}</p><p><b>Correct answer:</b> ${esc(q.a)}</p><p><b>Explanation:</b> ${esc(q.ex)}</p>`;el('reviews').appendChild(d)});el('again').onclick=()=>{at=0;chosen=Array(qs.length).fill(null);el('result').classList.add('hidden');el('quiz').classList.remove('hidden');draw();window.scrollTo({top:0,behavior:'smooth'})};window.scrollTo({top:0,behavior:'smooth'})}
draw();
</script></body></html>
